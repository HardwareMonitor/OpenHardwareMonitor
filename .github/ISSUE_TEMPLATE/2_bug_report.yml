name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in the fields below.

        If the application does not start or your antivirus removes files, see the "Antivirus warnings" section of the README first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I checked the open and closed issues and did not find a similar report.
          required: true
        - label: I am using the latest release.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in `Help > About` and in the title of the main window.
      placeholder: e.g. 3.0.9513 x64
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Which operating system do you use?
      placeholder: e.g. Windows 11 23H2 build 22631
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Run as administrator
      description: Many sensors are available only with administrator rights.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: troubleshoot
    attributes:
      label: What is wrong?
      description: Describe what does not work or works unexpectedly.
      placeholder: e.g. The CPU temperature sensor always shows 0 °C.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What did you try already?
      description: Optional. What have you tried to fix or work around the issue?
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce the bug?
      description: Describe the steps to reproduce the behavior. Be as specific as possible.
      placeholder: |
        1. Open '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What is the behavior that you expected?
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Optional. Save a report with `File > Save Report` and drag and drop it here, especially for missing or wrong sensors. Add the sensor log (CSV) or an error message if there is one.
  - type: input
    id: theme
    attributes:
      label: Theme and display scaling
      description: Optional. For UI problems, the selected theme and the Windows display scaling.
      placeholder: e.g. Dark theme, 150% scaling
  - type: dropdown
    id: plot-location
    attributes:
      label: Plot location
      description: Optional. For plot problems, where the plot is shown.
      options:
        - Not applicable
        - Window
        - Bottom
        - Right
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Optional. Screenshots or other information that helps to explain the problem.
